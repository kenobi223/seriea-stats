# Render blueprint: crea il servizio dal repository GitHub.
# Il piano Free non supporta i dischi persistenti: lo stato vive su Upstash Redis.
# Compila le variabili (Environment in dashboard) DOPO la creazione.
services:
  - type: web
    name: seriea-stats
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_IDS
        sync: false
      - key: SUBS_COUPONS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "540"
      - key: PUBLIC_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: DATA_SOURCE_ORDER
        value: "espn,sofascore"