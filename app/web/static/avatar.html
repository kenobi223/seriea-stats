<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barista AI · Serie A Stats</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#070a14;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:20px;margin:8px 0 2px}.sub{color:#888;font-size:13px;margin-bottom:12px}
#stage{width:min(320px,80vw);aspect-ratio:1;background:radial-gradient(circle at 50% 35%,#1c2547,#0a0e1f);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden}
#avatarWrap{position:relative;width:100%;height:100%}
#avatarWrap img{width:100%;height:100%;object-fit:cover;display:block}
#avatarWrap.talking img{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.02)}}
#mouthFx{position:absolute;left:43%;top:40%;width:14%;height:8px;background:#5a1f1f;border-radius:50%;transition:height .09s linear;box-shadow:inset 0 -2px 4px rgba(0,0,0,.5)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
button{background:#e94560;border:0;color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:14px}
button.ghost{background:#222b45}button:disabled{opacity:.5}
#log{margin-top:14px;max-width:560px;width:100%;background:#10162b;border-radius:12px;padding:12px;font-size:14px;line-height:1.5;min-height:80px;white-space:pre-wrap}
a{color:#7ea4ff;margin-top:12px;font-size:13px}
</style>
</head>
<body>
<h1>🎙️ Barista AI</h1>
<div class="sub">l'opinionista che ti legge i pronostici</div>
<div id="stage">
<div id="avatarWrap">
<img src="/logo.jpg" alt="Barista AI">
<div id="mouthFx"></div>
</div>
</div>
<div class="btns">
<button id="b-pred">📢 Pronostici</button>
<button id="b-table">🏆 Classifica</button>
<button id="b-stop" class="ghost">⏹ Stop</button>
</div>
<div id="log">Premi un pulsante e il barista parla…</div>
<a href="/">← torna alla dashboard</a>
<script>
const log=document.getElementById('log'),mouth=document.getElementById('mouthFx'),wrap=document.getElementById('avatarWrap');
let talkTimer=null;
function pickVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('it'))||vs[0];}
function animate(on){clearInterval(talkTimer);wrap.classList.remove('talking');if(!on){mouth.style.height='8px';return;}
wrap.classList.add('talking');
talkTimer=setInterval(()=>{if(!speechSynthesis.speaking){animate(false);return;}
mouth.style.height=(4+Math.round(Math.random()*16))+'px';});}
function speak(t){speechSynthesis.cancel();log.textContent=t;const u=new SpeechSynthesisUtterance(t);
u.voice=pickVoice();u.lang='it-IT';u.rate=1.02;u.onstart=()=>animate(true);u.onend=()=>animate(false);
speechSynthesis.speak(u);}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
async function state(){const r=await fetch('/api/state');return r.json();}
document.getElementById('b-pred').onclick=async(e)=>{e.target.disabled=true;
try{const s=await state();const fx=(s.fixtures||[]).slice(0,5);
if(!fx.length){speak('Non ci sono partite in programma, ripassa più tardi!');return;}
let t='Ecco i pronostici del bar. ';for(const f of fx){const p=((f.predictions||{})['1x2'])||{};
const h=Math.round((p['1']||0)*100),d=Math.round((p.x||0)*100),a=Math.round((p['2']||0)*100);
t+=`${f.home} contro ${f.away}: ${h} per cento uno, ${d} pareggio, ${a} due. `;}speak(t);
}catch(err){speak('Non riesco a leggere i dati in questo momento.');}e.target.disabled=false;};
document.getElementById('b-table').onclick=async(e)=>{e.target.disabled=true;
try{const s=await state();const st=[...(s.standings||[])].sort((a,b)=>(a.position||99)-(b.position||99)).slice(0,5);
if(!st.length){speak('Classifica non disponibile.');return;}
let t='Le prime cinque in classifica. ';st.forEach((r,i)=>{t+=`${i+1}, ${r.name} con ${r.points} punti. `;});speak(t);
}catch(err){speak('Non riesco a leggere la classifica.');}e.target.disabled=false;};
document.getElementById('b-stop').onclick=()=>{speechSynthesis.cancel();animate(false);};
</script>
</body>
</html>
