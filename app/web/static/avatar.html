<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barista AI · Serie A Stats</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#070a14;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:20px;margin:8px 0 2px}
.sub{color:#888;font-size:13px;margin-bottom:12px}
#stage{width:min(520px,92vw);height:min(60vh,560px);background:radial-gradient(circle at 50% 35%,#1c2547,#0a0e1f);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden;position:relative}
#avatar{width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#8ea0cf;font-size:14px;text-align:center;padding:20px}
.spin{width:26px;height:26px;border:3px solid #2a3560;border-top-color:#e94560;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
button{background:#e94560;border:0;color:#fff;font-weight:700;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px}
button.ghost{background:#222b45}
button.chip{background:#1b2440;font-weight:600;font-size:12px;padding:6px 12px}
button.chip.on{background:#e94560}
button:disabled{opacity:.5;cursor:default}
#status{margin-top:12px;color:#7d8bb0;font-size:12px;min-height:16px}
#log{margin-top:6px;max-width:560px;width:100%;background:#10162b;border-radius:12px;padding:12px;font-size:14px;line-height:1.8;min-height:70px;max-height:180px;overflow-y:auto}
#log .word{transition:color .15s}
#log .word.cur{color:#e94560;font-weight:700}
#log .word.past{color:#5b6890}
a{color:#7ea4ff;margin-top:12px;font-size:13px}
.credit{margin-top:6px;color:#4a5578;font-size:11px;text-align:center}
</style>
</head>
<body>
<h1>🎙️ Barista AI</h1>
<div class="sub">l'opinionista 3D che ti legge i pronostici</div>
<div id="stage">
<div id="avatar"></div>
<div id="loading"><div class="spin"></div><div id="loading-text">Caricamento avatar 3D…</div></div>
</div>
<div class="btns">
<button id="b-pred" disabled>📢 Pronostici</button>
<button id="b-table" disabled>🏆 Classifica</button>
<button id="b-stop" class="ghost" disabled>⏹ Stop</button>
</div>
<div class="btns" id="row-view">
<button class="chip" data-view="head">👤 Testa</button>
<button class="chip on" data-view="upper">🗣 Bustino</button>
<button class="chip" data-view="mid">👥 Mezzo</button>
<button class="chip" data-view="full">🧍 Intero</button>
<button class="chip on" id="b-head">📷 Testa: foto</button>
</div>
<div class="btns" id="row-mood">
<button class="chip on" data-mood="happy">😀 Felice</button>
<button class="chip" data-mood="neutral">😐 Neutro</button>
<button class="chip" data-mood="angry">😠 Arrabbiato</button>
<button class="chip" data-mood="sad">😢 Triste</button>
</div>
<div class="btns" id="row-gest">
<button class="chip" data-gest="thumbup">👍 Mi piace</button>
<button class="chip" data-gest="index">☝️ Indica</button>
<button class="chip" data-gest="ok">👌 D'accordo</button>
<button class="chip" data-gest="handup">✋ Mano su</button>
<button class="chip" data-gest="shrug">🤷 Boh</button>
</div>
<div id="status"></div>
<div id="log">Premi un pulsante e il barista parla…</div>
<a href="/">← torna alla dashboard</a>
<div class="credit">Avatar 3D: AvatarSDK demo (uso non commerciale) · TalkingHead MIT © Mika Suominen · Voce: Microsoft Edge TTS</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "talkinghead":"https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { TalkingHead } from 'talkinghead';
import { LipsyncIt } from '/lipsync-it.mjs';

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
let ready = false;
let curWord = null;

function status(s){ statusEl.textContent = s || ''; }
function log(s){ logEl.textContent = s; curWord = null; }

const head = new TalkingHead(document.getElementById('avatar'), {
  lipsyncModules: [],
  cameraView: 'upper',
  cameraRotateEnable: true,
  avatarMood: 'happy',
  lipsyncLang: 'it'
});
head.lipsync['it'] = new LipsyncIt();

try {
  await head.showAvatar({
    url: 'https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/avatarsdk.glb',
    body: 'M',
    avatarMood: 'happy',
    lipsyncLang: 'it',
    retarget: {
      Neck:   { z: -0.01, rx: -0.15 },
      Neck1:  { z: -0.01, rx: -0.15 },
      Neck2:  { z: -0.01, rx: -0.15 },
      LeftShoulder:  { rz: -0.3 },
      RightShoulder: { rz:  0.3 },
      scaleToEyesLevel: 1.0,
      origin: { y: -0.1 }
    },
    baseline: { headRotateX: -0.04, eyeBlinkLeft: 0.05, eyeBlinkRight: 0.05 }
  }, (e) => {
    if (e && e.total) {
      const pct = Math.round(e.loaded / e.total * 100);
      loadingText.textContent = `Caricamento avatar… ${pct}% (${(e.loaded/1048576).toFixed(0)} MB)`;
    }
  });
  try { await installPhotoHead(); } catch(err){
    console.warn('testa-foto non montata: ' + err);
    const bh = document.getElementById('b-head');
    bh.classList.remove('on'); bh.textContent = '👤 Testa: 3D';
  }
  ready = true;
  loadingEl.style.display = 'none';
  ['b-pred','b-table','b-stop'].forEach(id => document.getElementById(id).disabled = false);
  status('Avatar pronto ✓ — premi un pulsante');
} catch (err) {
  loadingText.textContent = '⚠️ Avatar non caricato: ' + (err && err.message || err);
  status('Riprova: la rete potrebbe aver bloccato il CDN');
}

// ---- karaoke ----
function onSubtitle(s){
  const w = (s || '').trim();
  if (!w) return;
  if (curWord){ curWord.classList.remove('cur'); curWord.classList.add('past'); }
  const sp = document.createElement('span');
  sp.className = 'word cur';
  sp.textContent = w + ' ';
  logEl.appendChild(sp);
  curWord = sp;
  logEl.scrollTop = logEl.scrollHeight;
}

// ---- testa-foto: la TUA foto montata sul corpo 3D ----
const HIDE_3D_HEAD = ['AvatarHead','AvatarEyelashes','AvatarLeftEyeball','AvatarRightEyeball','AvatarTeethLower','AvatarTeethUpper'];
const HEAD_BIND_CENTER = { x: 0, y: 1.624, z: 0.03 };  // centro testa in bind pose (dal GLB)
const HEAD_DIAM = 0.26;                                 // diametro cerchio foto (unità modello)
const MOUTH_POS = { x: 0.5, y: 0.67 };                  // posizione bocca nella foto (0..1)
const MOUTHS = {
  'sil': { w:.26, h:.015 }, 'PP': { w:.28, h:.02 }, 'FF': { w:.24, h:.05, teeth:true },
  'aa':  { w:.40, h:.26 }, 'E':  { w:.42, h:.15 }, 'I':  { w:.42, h:.11 },
  'O':   { w:.24, h:.22 }, 'U':  { w:.16, h:.15 },
  'kk':  { w:.30, h:.13 }, 'CH': { w:.28, h:.15 }, 'SS': { w:.34, h:.07, teeth:true },
  'DD':  { w:.30, h:.09 }, 'nn': { w:.30, h:.11 }, 'RR': { w:.26, h:.13 }
};
let face = null;          // { sprite, canvas, ctx, texture, img }
let hiddenMeshes = [];
let photoMode = true;
let timeline = [], speakT0 = 0, mouthRAF = 0, lastViseme = '';

function drawFace(v){
  if (!face) return;
  const { ctx, img } = face;
  ctx.clearRect(0, 0, 512, 512);
  ctx.save();
  ctx.beginPath(); ctx.arc(256, 256, 250, 0, Math.PI * 2); ctx.clip();
  const s = Math.max(512 / img.width, 512 / img.height);
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
  // bocca animata
  const m = MOUTHS[v] || { w:.26, h:.015 };
  const mx = MOUTH_POS.x * 512, my = MOUTH_POS.y * 512;
  ctx.fillStyle = '#5e1b1b'; ctx.strokeStyle = 'rgba(50,8,8,.85)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(mx, my, m.w * 256, Math.max(0.012, m.h) * 256, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  if (m.teeth){
    ctx.fillStyle = 'rgba(242,240,232,.95)';
    ctx.beginPath(); ctx.ellipse(mx, my - m.h * 256 * 0.35, m.w * 256 * 0.78, m.h * 256 * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // anello tematico
  ctx.beginPath(); ctx.arc(256, 256, 248, 0, Math.PI * 2);
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(233,69,96,.9)'; ctx.stroke();
  face.texture.needsUpdate = true;
}

async function installPhotoHead(){
  const img = new Image();
  img.src = '/myavatar.jpg';
  await img.decode();
  const bone = head.armature.getObjectByName('Head');
  if (!bone) throw new Error('osso Head non trovato');
  // nasconde la testa 3D
  hiddenMeshes = [];
  head.scene.traverse(o => {
    if (HIDE_3D_HEAD.includes(o.name) && o.isMesh){ o.visible = false; hiddenMeshes.push(o); }
  });
  if (!hiddenMeshes.length) throw new Error('mesh testa 3D non trovate');
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
  sprite.scale.set(HEAD_DIAM, HEAD_DIAM, 1);
  sprite.renderOrder = 10;
  sprite.frustumCulled = false;
  // offset locale: centro testa (bind) espresso nel riferimento dell'osso Head
  bone.updateWorldMatrix(true, false);
  const inv = bone.matrixWorld.clone().invert();
  sprite.position.set(HEAD_BIND_CENTER.x, HEAD_BIND_CENTER.y, HEAD_BIND_CENTER.z).applyMatrix4(inv);
  bone.add(sprite);
  face = { sprite, canvas, ctx, texture, img };
  drawFace('sil');
}

function setHeadMode(photo){
  photoMode = photo;
  hiddenMeshes.forEach(m => { m.visible = !photo; });
  if (face) face.sprite.visible = photo;
  const b = document.getElementById('b-head');
  b.classList.toggle('on', photo);
  b.textContent = photo ? '📷 Testa: foto' : '👤 Testa: 3D';
}

function buildTimeline(d){
  const ev = [];
  let end = 0;
  for (let i = 0; i < d.words.length; i++){
    const word = d.words[i];
    if (!word || !word.length) continue;
    const time = d.wtimes[i];
    let duration = d.wdurations[i];
    let val = null;
    try {
      const wrd = head.lipsyncPreProcessText(word, 'it');
      val = head.lipsyncWordsToVisemes(wrd, 'it');
    } catch(e){ val = null; }
    if (!val || !val.visemes || !val.visemes.length) continue;
    const dTotal = val.times[val.visemes.length - 1] + val.durations[val.visemes.length - 1];
    duration = Math.min(duration, val.visemes.length * 200);
    if (dTotal <= 0) continue;
    for (let j = 0; j < val.visemes.length; j++){
      const t = time + (val.times[j] / dTotal) * duration;
      const dd = (val.durations[j] / dTotal) * duration;
      ev.push({ t, d: dd, v: val.visemes[j] });
      end = Math.max(end, t + dd);
    }
  }
  return { ev, end: end + 500 };
}

function mouthLoop(){
  mouthRAF = requestAnimationFrame(mouthLoop);
  if (!face || !photoMode){ return; }
  const now = performance.now() - speakT0;
  if (now > timeline.end){ stopMouth(); return; }
  let v = 'sil';
  for (const e of timeline.ev){
    if (now >= e.t && now < e.t + e.d){ v = e.v; break; }
  }
  if (v !== lastViseme){ lastViseme = v; drawFace(v); }
}

function startMouth(){
  stopMouth();
  lastViseme = '';
  mouthRAF = requestAnimationFrame(mouthLoop);
}

function stopMouth(){
  if (mouthRAF){ cancelAnimationFrame(mouthRAF); mouthRAF = 0; }
  if (face && lastViseme !== 'sil'){ lastViseme = 'sil'; drawFace('sil'); }
}


// ---- TTS + lipsync ----
async function speak(text, mood){
  if (!ready){ status('Avatar non ancora pronto…'); return; }
  try { head.stopSpeaking(); } catch(e){}
  stopMouth();
  logEl.innerHTML = ''; curWord = null;
  status('Sintesi vocale in corso…');
  let d;
  try {
    const r = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    d = await r.json();
  } catch(e){ d = { ok:false, err:'errore di rete' }; }
  if (!d.ok){
    status('');
    log('⚠️ TTS non disponibile: ' + (d.err || 'errore sconosciuto'));
    return;
  }
  try {
    const bin = atob(d.audio);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    if (head.audioCtx && head.audioCtx.state === 'suspended') await head.audioCtx.resume();
    const audio = await head.audioCtx.decodeAudioData(u8.buffer);
    head.setMood(mood || 'happy');
    timeline = buildTimeline(d);
    speakT0 = performance.now() + 40;
    head.speakAudio(
      { audio, words: d.words, wtimes: d.wtimes, wdurations: d.wdurations },
      { lipsyncLang: 'it' },
      onSubtitle
    );
    startMouth();
    status(`Lingua: it · ${d.words.length} parole · ${d.ms}ms`);
  } catch(err){
    status('');
    log('⚠️ Riproduzione non riuscita: ' + (err && err.message || err));
  }
}

// ---- pulsanti scena ----
function chipGroup(rowId, attr, fn){
  const row = document.getElementById(rowId);
  row.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || !b.dataset[attr] || !ready) return;
    row.querySelectorAll('.chip.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    fn(b.dataset[attr]);
  });
}
chipGroup('row-view',  'view', v => { try{ head.setView(v); }catch(e){} });
chipGroup('row-mood',  'mood', m => { try{ head.setMood(m); }catch(e){} });
chipGroup('row-gest',  'gest', g => { try{ head.playGesture(g, 3); }catch(e){} });

// ---- dati ----
async function state(){ const r = await fetch('/api/state'); return r.json(); }

document.getElementById('b-pred').onclick = async (e) => {
  e.target.disabled = true;
  try {
    const s = await state();
    const fx = (s.fixtures || []).slice(0, 5);
    if (!fx.length){ await speak('Non ci sono partite in programma, ripassa più tardi!', 'sad'); }
    else {
      let t = 'Ecco i pronostici del bar. ';
      for (const f of fx){
        const p = ((f.predictions || {})['1x2']) || {};
        const h = Math.round((p['1'] || 0) * 100), d = Math.round((p.x || 0) * 100), a = Math.round((p['2'] || 0) * 100);
        t += `${f.home} contro ${f.away}: ${h} per cento uno, ${d} pareggio, ${a} due. `;
      }
      await speak(t, 'happy');
    }
  } catch(err){
    await speak('Non riesco a leggere i dati in questo momento.', 'sad');
  } finally {
    e.target.disabled = false;
  }
};

document.getElementById('b-table').onclick = async (e) => {
  e.target.disabled = true;
  try {
    const s = await state();
    const st = [...(s.standings || [])].sort((a,b) => (a.position||99) - (b.position||99)).slice(0, 5);
    if (!st.length){ await speak('Classifica non disponibile.', 'sad'); }
    else {
      let t = 'Le prime cinque in classifica. ';
      st.forEach((r, i) => { t += `${i+1}, ${r.name} con ${r.points} punti. `; });
      await speak(t, 'neutral');
    }
  } catch(err){
    await speak('Non riesco a leggere la classifica.', 'sad');
  } finally {
    e.target.disabled = false;
  }
};

document.getElementById('b-stop').onclick = () => {
  try { head.stopSpeaking(); } catch(e){}
  stopMouth();
  status('Interrotto');
};

document.getElementById('b-head').onclick = () => {
  if (!face){ status('Testa-foto non disponibile (myavatar.jpg)'); return; }
  setHeadMode(!photoMode);
};
</script>
</body>
</html>
