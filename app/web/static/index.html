<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Serie A Stats - classifica, pronostici Poisson, quote e forma in tempo reale">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serie A Stats">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.svg">
  <title>Serie A · Statistiche e Pronostici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/logo.png" onerror="this.onerror=null;this.src='/logo.svg'" alt="Serie A Stats logo" width="42" height="42" style="border-radius:50%; flex-shrink:0; object-fit:cover; border:2px solid rgba(255,255,255,.15); box-shadow:0 4px 16px rgba(0,0,0,.3);">
    <h1>Serie A Stats</h1>
    <span class="sub">classifica · forma · quote · pronostici</span>
    <a id="tg-link" href="/telegram" target="_blank" rel="noopener" style="margin-left:8px; display:inline-flex; align-items:center; gap:6px; background: linear-gradient(135deg,#2AABEE,#229ED9); color:#fff; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; text-decoration:none; box-shadow:0 4px 12px rgba(42,171,238,.3); transition: transform .15s;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75l-2.2-1.63c-.6-.44-.21-.68.13-1.08l.49-.51 3.56-3.26c.15-.14-.36-.1-.59.06l-4.4 2.77-1.95-.65c-.21-.06-.22-.2-.04-.3l7.63-3c.18-.06.34-.03.48.18l.01.01z"/></svg>
      Telegram
    </a>
    <div class="status">
      <span class="live-dot"></span>
      <span id="last-updated">—</span>
      <span id="cycle-status" class="muted"></span>
    </div>
  </header>

  <nav id="tabs">
    <button class="active" data-tab="matches">Partite</button>
    <button data-tab="results">Live & Risultati</button>
    <button data-tab="standings">Classifica</button>
    <button data-tab="teams">Squadre</button>
    <button data-tab="ai">AI Insights</button>
    <button data-tab="schedina">Schedina</button>
    <button data-tab="tracking">Onestà</button>
  </nav>

  <div id="controls" style="max-width:1220px; margin:14px auto 0; padding:0 20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <div style="position:relative; flex:1; min-width:220px;">
      <input id="search" placeholder="🔍 Cerca squadra o partita..." style="width:100%; padding:10px 14px 10px 36px;">
      <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;">⌕</span>
    </div>
    <select id="filter-round" style="min-width:140px;"><option value="">Tutte le giornate</option></select>
    <button id="fav-toggle" class="ghost" title="Mostra solo preferiti">⭐ Preferiti</button>
    <button id="sort-toggle" class="ghost" title="Ordina">⇅ Ordina</button>
  </div>

  <main>
    <section class="tab active" id="tab-matches"></section>
    <section class="tab" id="tab-results"></section>
    <section class="tab" id="tab-standings"></section>
    <section class="tab" id="tab-teams"></section>
    <section class="tab" id="tab-ai"></section>
    <section class="tab" id="tab-schedina"></section>
    <section class="tab" id="tab-tracking"></section>
  </main>

  <footer>
    <div id="tunnel-box" class="muted">Link pubblico: —</div>
    <div style="margin-top:10px;">
      <a href="/telegram" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; background:#2AABEE; color:#fff; padding:8px 16px; border-radius:999px; font-size:12px; font-weight:700; text-decoration:none;">Apri su Telegram <span style="opacity:.9;">↗</span></a>
    </div>
    <div class="muted" style="margin-top:8px; font-size:11px;">Serie A Stats · modello Poisson Dixon-Coles · dati ESPN/Sofascore</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
