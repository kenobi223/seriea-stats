<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Serie A Stats - classifica, pronostici Poisson, quote e forma in tempo reale">
  <meta name="theme-color" content="#070a14">
  <title>Serie A · Statistiche e Pronostici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Serie A Stats</h1>
    <span class="sub">classifica · forma · quote · pronostici</span>
    <div class="status">
      <span class="live-dot"></span>
      <span id="last-updated">—</span>
      <span id="cycle-status" class="muted"></span>
    </div>
  </header>

  <nav id="tabs">
    <button class="active" data-tab="matches">Partite e pronostici</button>
    <button data-tab="results">Risultati e live</button>
    <button data-tab="tracking">Onestà del modello</button>
    <button data-tab="schedina">🎫 Schedina</button>
    <button data-tab="ai">Chiedi all'AI</button>
    <button data-tab="standings">Classifica</button>
    <button data-tab="sources">Fonti</button>
  </nav>

  <main>
    <section class="tab active" id="tab-matches"></section>
    <section class="tab" id="tab-results"></section>
    <section class="tab" id="tab-tracking"></section>
    <section class="tab" id="tab-schedina"></section>
    <section class="tab" id="tab-ai"></section>
    <section class="tab" id="tab-standings"></section>
    <section class="tab" id="tab-sources"></section>
  </main>

  <footer>
    <div id="tunnel-box" class="muted">Link pubblico: —</div>
    <div class="muted" style="margin-top:6px; font-size:11px;">Serie A Stats · modello Poisson Dixon-Coles · dati ESPN/Sofascore</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
