<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Serie A Stats - classifica, pronostici Poisson, quote e forma in tempo reale">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serie A Stats">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <title>Serie A · Statistiche e Pronostici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="site-header">
    <img class="logo" src="/logo.jpg" onerror="this.onerror=null;this.src='/logo.svg'" alt="Serie A Stats logo" width="42" height="42">
    <h1>Serie A Stats</h1>
    <span class="sub">classifica · forma · quote · pronostici</span>
    <a id="tg-link" class="tg-btn" href="/telegram" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75l-2.2-1.63c-.6-.44-.21-.68.13-1.08l.49-.51 3.56-3.26c.15-.14-.36-.1-.59.06l-4.4 2.77-1.95-.65c-.21-.06-.22-.2-.04-.3l7.63-3c.18-.06.34-.03.48.18l.01.01z"/></svg>
      Telegram
    </a>
    <div class="status">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="last-updated">—</span>
      <span id="cycle-status" class="muted"></span>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Sezioni">
    <button id="tab-btn-matches" role="tab" aria-selected="true" aria-controls="tab-matches" class="active" data-tab="matches">Partite</button>
    <button id="tab-btn-results" role="tab" aria-selected="false" aria-controls="tab-results" data-tab="results">Live &amp; Risultati</button>
    <button id="tab-btn-standings" role="tab" aria-selected="false" aria-controls="tab-standings" data-tab="standings">Classifica</button>
    <button id="tab-btn-teams" role="tab" aria-selected="false" aria-controls="tab-teams" data-tab="teams">Squadre</button>
    <button id="tab-btn-ai" role="tab" aria-selected="false" aria-controls="tab-ai" data-tab="ai">AI Insights</button>
    <button id="tab-btn-schedina" role="tab" aria-selected="false" aria-controls="tab-schedina" data-tab="schedina">Schedina</button>
    <button id="tab-btn-tracking" role="tab" aria-selected="false" aria-controls="tab-tracking" data-tab="tracking">Onestà</button>
  </nav>

  <div id="controls">
    <div class="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" aria-label="Cerca squadra o partita" placeholder="Cerca squadra o partita…">
    </div>
    <select id="filter-round" aria-label="Filtra per giornata"><option value="">Tutte le giornate</option></select>
    <button id="fav-toggle" class="ghost" aria-pressed="false" title="Mostra solo le partite delle squadre preferite">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
      Preferiti
    </button>
    <button id="sort-toggle" class="ghost" title="Cambia ordinamento">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg>
      <span id="sort-label">Ordina: ora</span>
    </button>
  </div>

  <main>
    <section class="tab active" id="tab-matches" role="tabpanel" aria-labelledby="tab-btn-matches"></section>
    <section class="tab" id="tab-results" role="tabpanel" aria-labelledby="tab-btn-results"></section>
    <section class="tab" id="tab-standings" role="tabpanel" aria-labelledby="tab-btn-standings"></section>
    <section class="tab" id="tab-teams" role="tabpanel" aria-labelledby="tab-btn-teams"></section>
    <section class="tab" id="tab-ai" role="tabpanel" aria-labelledby="tab-btn-ai"></section>
    <section class="tab" id="tab-schedina" role="tabpanel" aria-labelledby="tab-btn-schedina"></section>
    <section class="tab" id="tab-tracking" role="tabpanel" aria-labelledby="tab-btn-tracking"></section>
  </main>

  <footer>
    <div id="tunnel-box" class="muted">Link pubblico: —</div>
    <div class="footer-actions">
      <a class="tg-btn" href="/telegram" target="_blank" rel="noopener">Apri su Telegram <span aria-hidden="true">↗</span></a>
    </div>
    <div class="credit muted">Serie A Stats · modello Poisson Dixon-Coles · dati ESPN/Sofascore</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
